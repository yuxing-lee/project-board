<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>專案進度看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one working column; sticky project bar, a 7-day to-do strip, then a full-period Gantt grid. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f8f9fb; --ink:#18202d; --muted:#5b6577; --faint:#8a93a3;
  --line:#dde2ea; --line-strong:#c6cdd8;
  --accent:#2453c4; --accent-ink:#ffffff; --accent-soft:#e4ebfb;
  --bar:#4b74d8; --bar-ink:#ffffff; --bar-done:#b9c1ce; --phase:#2b3445; --mile:#d4861a;
  --weekend:#edf0f5; --today:#e0453f; --late:#e5675f; --tg0:#2453c4; --tg1:#b4531f; --tg2:#1f7a5a; --tg3:#8a3fb3; --tg4:#a0346b; --tg5:#5d6b12;
  --ok:#24935f; --ok-soft:#e1f3ea; --warn:#c77c12; --warn-soft:#fbf0dc; --bad:#d2403a; --bad-soft:#fbe5e3; --pause:#6f7888; --pause-soft:#eceef2;
  --shadow:0 1px 2px rgba(24,32,45,.06),0 4px 16px rgba(24,32,45,.06);
  --f-ui:"Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-head:"Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#191d25; --surface-2:#1e232c; --ink:#e7eaf0; --muted:#a0a9b8; --faint:#737d8e;
  --line:#2b313d; --line-strong:#3a4250;
  --accent:#86a3f2; --accent-ink:#0f1420; --accent-soft:#222c44;
  --bar:#5d82e2; --bar-ink:#ffffff; --bar-done:#3d4452; --phase:#c8cfdb; --mile:#f0a63a;
  --weekend:#1d2129; --today:#ff6a64; --late:#d9615b; --tg0:#86a3f2; --tg1:#f0a06a; --tg2:#5fcf9f; --tg3:#c590ee; --tg4:#ee8bbd; --tg5:#b9c75a;
  --ok:#4cc58a; --ok-soft:#183026; --warn:#f0a63a; --warn-soft:#33281a; --bad:#ff6a64; --bad-soft:#3a1f1f; --pause:#9aa3b2; --pause-soft:#262b34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#191d25; --surface-2:#1e232c; --ink:#e7eaf0; --muted:#a0a9b8; --faint:#737d8e;
  --line:#2b313d; --line-strong:#3a4250;
  --accent:#86a3f2; --accent-ink:#0f1420; --accent-soft:#222c44;
  --bar:#5d82e2; --bar-ink:#ffffff; --bar-done:#3d4452; --phase:#c8cfdb; --mile:#f0a63a;
  --weekend:#1d2129; --today:#ff6a64; --late:#d9615b; --tg0:#86a3f2; --tg1:#f0a06a; --tg2:#5fcf9f; --tg3:#c590ee; --tg4:#ee8bbd; --tg5:#b9c75a;
  --ok:#4cc58a; --ok-soft:#183026; --warn:#f0a63a; --warn-soft:#33281a; --bad:#ff6a64; --bad-soft:#3a1f1f; --pause:#9aa3b2; --pause-soft:#262b34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.icon-btn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-active{color:var(--accent);background:var(--accent-soft)}
.st-late{color:var(--bad);background:var(--bad-soft)}
.st-done{color:var(--ok);background:var(--ok-soft)}
.st-pause{color:var(--pause);background:var(--pause-soft)}

/* home */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-head);font-size:20px;font-weight:700;margin:0;letter-spacing:.02em}
.brand .date{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.home-main{padding-block:24px 48px}
.home-summary{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px;color:var(--muted);font-size:13px}
.home-summary b{color:var(--ink);font-family:var(--f-mono);font-weight:500;margin-right:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.client{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.card h2{font-family:var(--f-head);font-size:17px;font-weight:700;margin:2px 0 0;text-wrap:balance;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.timeline-mini{position:relative;height:6px;border-radius:3px;background:var(--weekend);margin-top:4px}
.timeline-mini .elapsed{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--line-strong)}
.timeline-mini .now{position:absolute;top:-4px;width:2px;height:14px;background:var(--today);border-radius:1px}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.warn-chip{color:var(--bad);font-weight:600}
.empty{padding:48px 24px;text-align:center;border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface);color:var(--muted)}
.empty h2{font-family:var(--f-head);color:var(--ink);font-size:18px;margin:0 0 6px}
.footnote{margin-top:28px;font-size:12.5px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* project header */
.p-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.p-head .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.p-title{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px}
.p-title .line1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.p-title .cl{font-family:var(--f-head);font-weight:500;color:var(--muted);font-size:16px}
.p-title .sep{color:var(--line-strong);font-size:16px}
.p-title h1{font-family:var(--f-head);font-size:20px;font-weight:700;margin:0;overflow-wrap:anywhere}
.p-meta{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.p-meta .k{color:var(--faint);margin-right:4px}
.p-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-select{appearance:none;-webkit-appearance:none;border:0;padding:0 26px 0 12px;height:28px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 12px,calc(100% - 9px) 12px;background-size:4px 4px;background-repeat:no-repeat}
.status-select.st-active{background-color:var(--accent-soft)} .status-select.st-late{background-color:var(--bad-soft)} .status-select.st-done{background-color:var(--ok-soft)} .status-select.st-pause{background-color:var(--pause-soft)}
.status-select option{color:var(--ink);background:var(--surface)}

.p-main{padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
.p-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.p-layout.side-closed{grid-template-columns:minmax(0,1fr) 44px}
.p-content{min-width:0;display:flex;flex-direction:column;gap:22px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head-h,72px) + 16px);max-height:calc(100vh - var(--head-h,72px) - 36px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.side-h{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}
.side-title{flex:1;font-family:var(--f-head);font-weight:700;font-size:14px;letter-spacing:.04em;white-space:nowrap}
.side-count{font-size:12px;color:var(--muted)}
.side-body{display:flex;flex-direction:column}
.side-sec{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px}
.side-sec+.side-sec{border-top:1px solid var(--line)}
.side-sec h3{margin:0;font-family:var(--f-head);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between;align-items:baseline}
.side-sec h3 .num{font-weight:500;letter-spacing:0}
.side-progress{height:4px;border-radius:2px;background:var(--weekend);overflow:hidden}
.side-progress i{display:block;height:100%;background:var(--ok);border-radius:2px}
.check-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.check-list .empty-line{font-size:12.5px;color:var(--faint);padding:2px 4px}
.side-add input{width:100%;border:1px dashed var(--line-strong);background:transparent;border-radius:6px;padding:6px 8px;font-size:13px}
.side-add input:focus{border-style:solid;border-color:var(--accent);outline:none;background:var(--surface)}
.notes-ta{width:100%;min-height:160px;border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;background:var(--surface-2);font-size:13px;line-height:1.6;resize:vertical}
.notes-ta:focus{border-color:var(--accent);outline:2px solid var(--accent-soft);background:var(--surface)}
.side-closed .side{overflow:visible}
.side-closed .side-body{display:none}
.side-closed .side-h{flex-direction:column;border-bottom:0;padding:8px 6px 12px;gap:10px}
.side-closed .side-h .icon-btn{order:-1}
.side-closed .side-title{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;line-height:1.15}
.side-closed .side-title b{font-weight:700;display:block}
.side-closed .side-count{display:none}
@media (max-width:960px){
  .p-layout,.p-layout.side-closed{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;order:-1}
  .side-closed .side-h{flex-direction:row;padding:8px 8px 8px 14px}
  .side-closed .side-h .icon-btn{order:0}
  .side-closed .side-title{display:block}
  .side-closed .side-title b{display:inline}
  .side-closed .side-count{display:inline}
}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-family:var(--f-head);font-size:15px;font-weight:700;margin:0;letter-spacing:.04em}
.sec-head .sub{font-size:12.5px;color:var(--muted);margin-left:10px;font-weight:400;letter-spacing:0}
.week-nav{display:flex;align-items:center;gap:4px}
.week-nav .range{font-family:var(--f-mono);font-size:13px;min-width:120px;text-align:center}

/* home tabs + filters */
.tabs{display:inline-flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:6px;font-weight:600;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.home-week{margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.home-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.filters{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.filters label{font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.filters select,.filters input{height:30px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);padding:0 8px;font-size:13px;max-width:200px}
.filters select:focus,.filters input:focus{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.week-sum{font-size:12.5px;color:var(--muted)}
.week-sum b{color:var(--ink);font-weight:600}
.day-empty{font-size:12px;color:var(--faint);padding:6px 4px}
.add-hint{font-size:12px;color:var(--faint);padding:8px 6px}
.tx-btn{border:0;background:transparent;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;overflow-wrap:anywhere}
.tx-btn:hover{color:var(--accent)}
.tmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.ptag{font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;line-height:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{font-size:11px;color:var(--muted);line-height:16px;border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:0 5px;white-space:nowrap}
.tg0{color:var(--tg0);background:color-mix(in srgb,var(--tg0) 14%,transparent)}
.tg1{color:var(--tg1);background:color-mix(in srgb,var(--tg1) 14%,transparent)}
.tg2{color:var(--tg2);background:color-mix(in srgb,var(--tg2) 14%,transparent)}
.tg3{color:var(--tg3);background:color-mix(in srgb,var(--tg3) 14%,transparent)}
.tg4{color:var(--tg4);background:color-mix(in srgb,var(--tg4) 14%,transparent)}
.tg5{color:var(--tg5);background:color-mix(in srgb,var(--tg5) 14%,transparent)}
/* todo */
.todo-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.todo-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1050px}
.day{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.day:last-child{border-right:0}
.day.weekend{background:var(--surface-2)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.day-h .wd{font-weight:600}
.day-h .dt{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.day.today .day-h{background:var(--accent);color:var(--accent-ink)}
.day.today .day-h .dt{color:var(--accent-ink);opacity:.85}
.day.past .todo-list{opacity:.8}
.todo-list{list-style:none;margin:0;padding:6px 6px 0;display:flex;flex-direction:column;gap:2px;flex:1}
.todo{display:grid;grid-template-columns:18px 1fr 22px;gap:6px;align-items:start;padding:5px 4px;border-radius:6px;font-size:13px}
.todo:hover{background:var(--accent-soft)}
.todo input[type=checkbox]{margin:3px 0 0;accent-color:var(--accent);width:14px;height:14px}
.todo .tx{min-width:0;overflow-wrap:anywhere}
.todo.done .tx{color:var(--faint)}
.todo.done .tx-btn,.todo.done .tx>:not(.tmeta){text-decoration:line-through}
.todo .from{display:block;font-size:11px;color:var(--warn);font-weight:500}
.todo .del{opacity:0;width:22px;height:22px;border:0;background:transparent;color:var(--faint);border-radius:4px;display:grid;place-items:center}
.todo:hover .del,.todo .del:focus-visible{opacity:1}
.todo .del:hover{color:var(--bad)}
@media (hover:none){.todo .del{opacity:.6}}
.todo-add{padding:6px}
.todo-add input{width:100%;border:1px dashed var(--line-strong);background:transparent;border-radius:6px;padding:5px 8px;font-size:13px}
.todo-add input:focus{border-style:solid;border-color:var(--accent);outline:none;background:var(--surface)}

/* gantt */
.gantt-box{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.gantt{overflow-x:auto;position:relative}
.g-inner{position:relative}
.g-head{display:flex;border-bottom:1px solid var(--line-strong);background:var(--surface)}
.g-corner{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:flex-end;padding:0 12px 6px;font-size:12px;color:var(--muted);font-weight:500;flex:none}
.g-scale{position:relative;flex:none}
.g-months{display:flex;height:20px;border-bottom:1px solid var(--line)}
.g-month{font-size:11.5px;font-weight:600;color:var(--muted);padding:2px 6px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.g-month:first-child{border-left:0}
.g-days{display:flex;height:30px}
.g-day{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;border-left:1px solid var(--line);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.g-day:first-child{border-left:0}
.g-day .w{font-family:var(--f-ui);font-size:10px;color:var(--faint)}
.g-day.we{background:var(--weekend)}
.g-day.td{color:var(--today);font-weight:500}
.g-day.td .w{color:var(--today)}
.g-body{position:relative}
.g-bg{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.g-bg .we{position:absolute;top:0;bottom:0;background:var(--weekend)}
.g-bg .vl{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.55}
.g-bg .now{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:2}
.g-row{display:flex;position:relative;z-index:1;border-bottom:1px solid var(--line)}
.g-row.phase{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.g-lbl{position:sticky;left:0;z-index:3;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;background:var(--surface);border-right:1px solid var(--line);min-width:0}
.g-row.phase .g-lbl{background:var(--surface-2);font-weight:600}
.g-lbl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-size:13px;border:0;background:transparent;text-align:left;padding:2px 0}
.g-lbl .nm:hover{color:var(--accent)}
.g-row.task .g-lbl{padding-left:30px}
.g-lbl input[type=checkbox]{accent-color:var(--accent);margin:0;width:14px;height:14px;flex:none}
.g-row.is-done .nm{color:var(--faint);text-decoration:line-through}
.g-lbl .dia{width:9px;height:9px;transform:rotate(45deg);background:var(--mile);flex:none;margin:0 2px}
.g-lbl .warn{color:var(--bad);flex:none;display:grid;place-items:center}
.g-lbl .tw{width:18px;height:18px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;flex:none}
.g-lbl .tw svg{transition:transform .15s}
.g-lbl .tw.closed svg{transform:rotate(-90deg)}
.g-lbl .add{opacity:.55}

<script>
(() => {
'use strict';
/* ---------- utilities ---------- */
const pad = n => String(n).padStart(2, '0');
const toDn = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const fromDn = n => { const d = new Date(n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const addDays = (s, n) => fromDn(toDn(s) + n);
const dow = s => new Date(toDn(s) * 864e5).getUTCDay();
const md = s => { const [, m, d] = s.split('-'); return `${+m}/${+d}`; };
const ymd = s => s.replace(/-/g, '/');
const WD = '日一二三四五六';
const mondayOf = s => addDays(s, -((dow(s) + 6) % 7));
const daysBetween = (a, b) => toDn(b) - toDn(a);
const newId = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = (sel, root = document) => root.querySelector(sel);

const STATUS = { active: '進行中', late: '延遲', done: '完成', pause: '暫停' };
const STATUS_ORDER = { late: 0, active: 1, pause: 2, done: 3 };

const ICON = {
  back: '<svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  left: '<svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  edit: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  close: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  lock: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  unlock: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>',
  chev: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 9l6 6 6-6"/></svg>',
  warn: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>',
  down: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>',
};

/* ---------- storage ---------- */
const LS_KEY = 'project-gantt-v1';
const Store = {
  mode: 'local', db: null, uid: null, projects: {}, timers: {}, chains: {}, pending: 0, failed: false,
  async init() {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (db && user) {
          const uid = await user.id();
          if (uid) {
            this.db = db; this.uid = uid;
            const snap = await this.col().get();
            snap.docs.forEach(d => { if (d.exists) this.projects[d.id] = normalize(structuredClone(d.data()), d.id); });
            this.mode = 'db';
            return;
          }
        }
      }
    } catch (e) { console.warn('db unavailable', e); }
    this.loadLocal();
  },
  col() { return this.db.collection('data/users/' + this.uid); },
  loadLocal() {
    this.mode = 'local';
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const obj = JSON.parse(raw); Object.values(obj || {}).forEach(p => { if (p && p.id) this.projects[p.id] = normalize(p, p.id); }); }
    } catch (e) { /* storage blocked */ }
  },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.projects)); this.setState('ok'); } catch (e) { this.setState('fail'); } },
  list() { return Object.values(this.projects); },
  get(id) { return this.projects[id]; },
  save(p, now = false) {
    deepHalf(p);
    p.updatedAt = new Date().toISOString();
    this.projects[p.id] = p;
    if (this.mode !== 'db') { this.saveLocal(); return; }
    clearTimeout(this.timers[p.id]);
    this.setState('saving');
    const run = () => {
      delete this.timers[p.id];
      const body = JSON.parse(JSON.stringify(this.projects[p.id]));
      this.pending++;
      this.chains[p.id] = (this.chains[p.id] || Promise.resolve())
        .then(() => this.col().doc(p.id).set(body))
        .then(() => { this.pending--; this.failed = false; if (!this.pending) this.setState('ok'); })
        .catch(e => { this.pending--; this.failed = true; this.setState('fail'); console.error(e); toast(e && e.code === 'quota_exceeded' ? '儲存空間已滿,請刪除部分專案' : '儲存失敗,請檢查連線後再修改一次'); });
    };
    if (now) run(); else this.timers[p.id] = setTimeout(run, 500);
  },
  remove(id) {
    clearTimeout(this.timers[id]); delete this.timers[id];
    delete this.projects[id];
    if (this.mode !== 'db') { this.saveLocal(); return; }
    this.setState('saving'); this.pending++;
    this.chains[id] = (this.chains[id] || Promise.resolve())
      .then(() => this.col().doc(id).delete())
      .then(() => { this.pending--; if (!this.pending) this.setState('ok'); })
      .catch(() => { this.pending--; this.setState('fail'); toast('刪除失敗,請稍後再試'); });
  },
  setState(s) {
    const el = $('#savestate'); if (!el) return;
    el.className = 'savestate ' + (s === 'ok' ? '' : s);
    const t = el.querySelector('.t');
    if (t) t.textContent = s === 'saving' ? '儲存中…' : s === 'fail' ? '儲存失敗' : (this.mode === 'db' ? '已儲存到你的帳號' : '已儲存於此瀏覽器');
  },
};

/* Full-width Latin letters, digits and a few code-ish symbols -> half-width.
   Chinese punctuation (,:;()!?「」) is left alone on purpose. */
const FW_RE = /[\uFF10-\uFF19\uFF21-\uFF3A\uFF41-\uFF5A\uFF0D\uFF0E\uFF0F\uFF3F\uFF20\uFF03\uFF06\uFF0B\uFF1D\uFF05]/g;
const half = str => str.replace(FW_RE, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, ' ');
function deepHalf(o) {
  if (Array.isArray(o)) { o.forEach((v, i) => { if (typeof v === 'string') o[i] = half(v); else if (v && typeof v === 'object') deepHalf(v); }); }
  else if (o && typeof o === 'object') { Object.keys(o).forEach(k => { const v = o[k]; if (typeof v === 'string') o[k] = half(v); else if (v && typeof v === 'object') deepHalf(v); }); }
  return o;
}
function normalize(p, id) {
  deepHalf(p);
  p.id = p.id || id;
  p.client = p.client || ''; p.name = p.name || '未命名專案'; p.owner = p.owner || '';
  if (!isDate(p.start)) p.start = todayStr();
  if (!isDate(p.end) || p.end < p.start) p.end = addDays(p.start, 33);
  if (!STATUS[p.status]) p.status = 'active';
  p.phases = Array.isArray(p.phases) ? p.phases : [];
  p.phases.forEach(ph => {
    ph.id = ph.id || newId(); ph.name = ph.name || '階段'; ph.items = Array.isArray(ph.items) ? ph.items : [];
    ph.items.forEach(it => {
      it.id = it.id || newId(); it.kind = it.kind === 'milestone' ? 'milestone' : 'task';
      it.deps = Array.isArray(it.deps) ? it.deps : []; it.done = !!it.done; it.locked = !!it.locked;
      if (it.kind === 'milestone') { if (!isDate(it.date)) it.date = p.start; if (!isDate(it.bd)) it.bd = it.date; }
      else {
        if (!isDate(it.start)) it.start = p.start; if (!isDate(it.end) || it.end < it.start) it.end = it.start;
        if (!Array.isArray(it.segs) || !it.segs.length) it.segs = [{ id: newId(), name: '', start: it.start, end: it.end }];
        it.segs = it.segs.filter(x => x && typeof x === 'object');
        if (!it.segs.length) it.segs = [{ id: newId(), name: '', start: it.start, end: it.end }];
        it.segs.forEach(x => { x.id = x.id || newId(); x.name = typeof x.name === 'string' ? x.name : ''; if (!isDate(x.start)) x.start = it.start; if (!isDate(x.end) || x.end < x.start) x.end = x.start; if (!isDate(x.bs)) x.bs = x.start; if (!isDate(x.be) || x.be < x.bs) x.be = x.end; });
        syncTask(it);
      }
    });
  });
  p.todos = (p.todos && typeof p.todos === 'object') ? p.todos : {};
  Object.keys(p.todos).forEach(d => {
    if (!isDate(d) || !Array.isArray(p.todos[d])) { delete p.todos[d]; return; }
    p.todos[d] = p.todos[d].filter(x => x && x.text);
    p.todos[d].forEach(x => { x.id = x.id || newId(); x.done = !!x.done; x.who = typeof x.who === 'string' ? x.who : ''; });
    if (!p.todos[d].length) delete p.todos[d];
  });
  p.checklist = Array.isArray(p.checklist) ? p.checklist.filter(x => x && x.text) : [];
  p.checklist.forEach(x => { x.id = x.id || newId(); x.done = !!x.done; });
  p.notes = typeof p.notes === 'string' ? p.notes : '';
  return p;
}

/* ---------- domain helpers ---------- */
const allItems = p => p.phases.flatMap(ph => ph.items.map(it => ({ it, ph })));
const findItem = (p, id) => { for (const ph of p.phases) { const it = ph.items.find(x => x.id === id); if (it) return { it, ph }; } return null; };
function syncTask(it) {
  if (it.kind !== 'task' || !it.segs || !it.segs.length) return;
  it.segs.sort((a, b) => a.start.localeCompare(b.start));
  it.start = it.segs.reduce((m, x) => x.start < m ? x.start : m, it.segs[0].start);
  it.end = it.segs.reduce((m, x) => x.end > m ? x.end : m, it.segs[0].end);
}
const itStart = it => it.kind === 'milestone' ? it.date : it.start;
const itEnd = it => it.kind === 'milestone' ? it.date : it.end;
function conflictPairs(p) {
  const out = [];
  allItems(p).forEach(({ it }) => {
    it.deps.forEach(did => {
      const pr = findItem(p, did); if (!pr) return;
      const pe = itEnd(pr.it);
      const bad = it.kind === 'milestone' ? it.date < pe : it.start <= pe;
      out.push({ from: did, to: it.id, bad });
    });
  });
  return out;
}
const conflictCount = p => conflictPairs(p).filter(c => c.bad).length;
/* planned (baseline) end and delay in days; positive = late */
const baseEnd = it => it.kind === 'milestone' ? it.bd : it.segs.reduce((m, x) => x.be > m ? x.be : m, it.segs[0].be);
const delayDays = it => daysBetween(baseEnd(it), itEnd(it));
const delayedCount = p => allItems(p).filter(({ it }) => !it.done && delayDays(it) > 0).length;
const rangeEnd = p => allItems(p).reduce((m, { it }) => itEnd(it) > m ? itEnd(it) : m, p.end);
function shiftItem(it, n) {
  if (it.kind === 'milestone') it.date = addDays(it.date, n);
  else { it.segs.forEach(sg => { sg.start = addDays(sg.start, n); sg.end = addDays(sg.end, n); }); syncTask(it); }
}
function setBaseline(it) {

    <div class="modal-f"><button class="btn danger" type="button" id="td-del">刪除</button>
      <div class="r"><button class="btn" data-act="close-modal">取消</button><button class="btn primary" type="submit" form="tdform">儲存</button></div></div>`, () => {
    $('#tdform').addEventListener('submit', e => {
      e.preventDefault();
      const text = $('#td-text').value.trim(), nd = $('#td-date').value, np = Store.get($('#td-pid').value);
      if (!text) { $('#td-err').textContent = '請填寫內容'; return; }
      if (!isDate(nd)) { $('#td-err').textContent = '請選擇日期'; return; }
      const who = $('#td-who').value.trim();
      p.todos[d] = p.todos[d].filter(y => y !== x); if (!p.todos[d].length) delete p.todos[d];
      Object.assign(x, { text, done: $('#td-done').checked, who: who === np.owner ? '' : who });
      if (nd !== d || np !== p) delete x.from;
      (np.todos[nd] = np.todos[nd] || []).push(x);

}

/* ---------- gantt ---------- */
function renderGantt(p) {
  const box = $('#gantt'); if (!box) return;
  const keepSL = G.keepSL != null ? G.keepSL : (G.pid === p.id ? box.scrollLeft : null); G.keepSL = null;
  const W = box.clientWidth;
  const rEnd = rangeEnd(p);
  const days = daysBetween(p.start, rEnd) + 1;
  const labelW = W < 640 ? 150 : 240;
  const dw = Math.max(26, (W - labelW - 1) / days);
  const rowH = 36;
  const t = todayStr();
  const p0 = toDn(p.start);
  Object.assign(G, { dw, rowH, labelW, p0, days, pid: p.id });

  // header
  let months = '', cur = null, cnt = 0;
  const flushMonth = () => { if (cur) months += `<div class="g-month" style="width:${cnt * dw}px">${+cur.slice(5)} 月${cnt * dw > 70 ? ' ' + cur.slice(0, 4) : ''}</div>`; };
  let dayCells = '';
  for (let i = 0; i < days; i++) {
    const d = fromDn(p0 + i); const m = d.slice(0, 7);
    if (m !== cur) { flushMonth(); cur = m; cnt = 0; } cnt++;
    const w = dow(d);
    dayCells += `<div class="g-day${(w === 0 || w === 6) ? ' we' : ''}${d === t ? ' td' : ''}${d > p.end ? ' ov' : ''}" style="width:${dw}px"><span>${+d.slice(8)}</span><span class="w">${WD[w]}</span></div>`;
  }
  flushMonth();

  // rows
  const conf = conflictPairs(p);
  const badTo = new Set(conf.filter(c => c.bad).map(c => c.to));
  const rows = []; G.rowIdx = {};
  p.phases.forEach(ph => {
    G.rowIdx[ph.id] = rows.length; rows.push({ type: 'phase', ph });
    if (!ph.collapsed) ph.items.forEach(it => { G.rowIdx[it.id] = rows.length; rows.push({ type: it.kind, it, ph }); });
  });
  const tw = days * dw;
  const rowHtml = rows.map(r => {
    if (r.type === 'phase') {
      const sp = phaseSpan(r.ph);
      const bar = sp ? `<div class="phase-bar" style="left:${(toDn(sp.s) - p0) * dw}px;width:${(toDn(sp.e) - toDn(sp.s) + 1) * dw}px"></div>` : '';
      return `<div class="g-row phase" style="height:${rowH}px">
        <div class="g-lbl" style="width:${labelW}px">
          <button class="tw${r.ph.collapsed ? ' closed' : ''}" data-act="toggle-phase" data-id="${r.ph.id}" aria-label="${r.ph.collapsed ? '展開' : '收合'}" aria-expanded="${!r.ph.collapsed}">${ICON.chev}</button>
          <button class="nm" data-act="edit-phase" data-id="${r.ph.id}" title="${esc(r.ph.name)}">${esc(r.ph.name)}</button>
          ${r.ph.collapsed ? `<span class="muted num" style="font-size:11.5px;font-weight:400">${r.ph.items.length}</span>` : ''}
          <button class="icon-btn add" data-act="add-item" data-id="${r.ph.id}" aria-label="在此階段新增任務" title="新增任務或里程碑">${ICON.plus}</button>
        </div><div class="g-track" style="width:${tw}px">${bar}</div></div>`;
    }
    const it = r.it; const bad = badTo.has(it.id); const dly = delayDays(it);
    const lbl = `<div class="g-lbl" style="width:${labelW}px">
      ${it.kind === 'milestone' ? '<span class="dia" aria-hidden="true"></span>' : ''}
      <input type="checkbox" data-act="toggle-done" data-id="${it.id}" ${it.done ? 'checked' : ''} aria-label="完成 ${esc(it.name)}">
      <button class="nm" data-act="edit-item" data-id="${it.id}" title="${esc(it.name)}">${esc(it.name)}</button>
      <button class="lk${it.locked ? ' on' : ''}" data-act="toggle-lock" data-id="${it.id}" aria-pressed="${it.locked}" aria-label="${it.locked ? '解除鎖定日期' : '鎖定日期'}" title="${it.locked ? '已鎖定日期,不會被自動調整。點一下解除' : '鎖定日期,不讓前置任務自動調整它'}">${it.locked ? ICON.lock : ICON.unlock}</button>
      ${dly > 0 && !it.done ? `<span class="dl" title="比預計晚 ${dly} 天完成">延 ${dly} 天</span>` : ''}
      ${bad ? `<span class="warn" title="前置任務尚未結束就開始">${ICON.warn}</span>` : ''}</div>`;
    let shape;
    if (it.kind === 'milestone') {
      const x = (toDn(it.date) - p0 + .5) * dw;
      const ghost = it.bd !== it.date ? `<div class="ghost-mile" style="left:${(toDn(it.bd) - p0 + .5) * dw}px" title="預計 ${md(it.bd)}"></div>` : '';
      shape = ghost + `<div class="mile${it.locked ? ' locked' : ''}${it.done ? ' done' : ''}${bad ? ' conflict' : ''}" data-id="${it.id}" style="left:${x}px" title="${esc(it.name)} ${md(it.date)}"></div><span class="mile-lbl" data-ml="${it.id}" style="left:${x + 13}px">${md(it.date)}${dly > 0 && !it.done ? ` <b style="color:var(--bad)">+${dly}天</b>` : ''}</span>`;
    } else {
      shape = it.segs.map((sg, si) => {
        const x = (toDn(sg.start) - p0) * dw, w = (toDn(sg.end) - toDn(sg.start) + 1) * dw;
        const moved = sg.bs !== sg.start || sg.be !== sg.end;
        const ghost = moved ? `<div class="base-ghost" style="left:${(toDn(sg.bs) - p0) * dw}px;width:${(toDn(sg.be) - toDn(sg.bs) + 1) * dw}px"></div>` : '';
        const cut = (toDn(sg.be) - toDn(sg.start) + 1) * dw;
        const lateBg = !it.done && sg.end > sg.be ? `;background:linear-gradient(90deg,var(--bar) ${Math.max(0, cut)}px,var(--late) ${Math.max(0, cut)}px)` : '';
        const sd = daysBetween(sg.be, sg.end);
        const tip = `${sg.name ? sg.name + ' · ' : ''}${it.name}\n實際 ${md(sg.start)}–${md(sg.end)}\n預計 ${md(sg.bs)}–${md(sg.be)}${sd > 0 ? `(延 ${sd} 天)` : ''}`;
        return ghost + `<div class="bar${sg.name ? ' named' : ''}${sg.name && w < 60 ? ' short' : ''}${it.done ? ' done' : ''}${bad && si === 0 ? ' conflict' : ''}${it.locked ? ' locked' : ''}" data-id="${it.id}" data-seg="${sg.id}" style="left:${x}px;width:${w}px${lateBg}" title="${esc(tip)}"><span class="h-l"></span><span class="bt">${sg.name ? esc(sg.name) : barText(sg, w)}</span><span class="h-r"></span></div>`;
      }).join('');
    }
    return `<div class="g-row task${it.done ? ' is-done' : ''}" style="height:${rowH}px">${lbl}<div class="g-track" style="width:${tw}px">${shape}</div></div>`;
  }).join('');

  // background: weekends, grid lines, today
  let bg = '';
  for (let i = 0; i < days; i++) {
    const w = dow(fromDn(p0 + i));
    if (w === 0 || w === 6) bg += `<div class="we" style="left:${i * dw}px;width:${dw}px"></div>`;
    if (i && w === 1) bg += `<div class="vl" style="left:${i * dw}px"></div>`;
  }
  if (rEnd > p.end) { const xe = (toDn(p.end) - p0 + 1) * dw; bg += `<div class="over" style="left:${xe}px;width:${tw - xe}px"></div><div class="pend" style="left:${xe - 1}px" title="結案日 ${md(p.end)}"></div>`; }
  if (t >= p.start && t <= rEnd) bg += `<div class="now" style="left:${(toDn(t) - p0 + .5) * dw - 1}px" title="今天"></div>`;

  const H = rows.length * rowH;
  box.innerHTML = `<div class="g-inner" style="width:${labelW + tw}px">
    <div class="g-head"><div class="g-corner" style="width:${labelW}px">階段 / 任務</div>
      <div class="g-scale" style="width:${tw}px"><div class="g-months">${months}</div><div class="g-days">${dayCells}</div></div></div>
    <div class="g-body">
      <div class="g-bg" style="left:${labelW}px;width:${tw}px">${bg}</div>
      ${rowHtml}
      <svg class="g-arrows" id="g-arrows" style="left:${labelW}px" width="${tw}" height="${H}" viewBox="0 0 ${tw} ${H}"></svg>
    </div>
    ${p.phases.length ? '' : `<div class="g-addrow"><div class="g-lbl" style="width:100%;position:static"><span class="muted">先新增一個階段,例如「需求確認」,再在階段裡加入任務。</span></div></div>`}
  </div>`;
  drawArrows(p);
  if (keepSL !== null && G.scrolled) { box.scrollLeft = keepSL; return; }
  // first view of a project: keep today in view on narrow screens
  if (box.scrollWidth > box.clientWidth && t >= p.start && t <= rEnd && !G.scrolled) {
    box.scrollLeft = Math.max(0, (toDn(t) - p0) * dw - (W - labelW) / 3); G.scrolled = true;
  }
}
const barText = (it, w) => { const n = toDn(it.end) - toDn(it.start) + 1; return w >= 34 ? `${n}天` : ''; };

function drawArrows(p) {
  const svg = $('#g-arrows'); if (!svg) return;
  const { dw, rowH, p0 } = G;
  const conf = conflictPairs(p);
  let out = `<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L8 4L0 8z"/></marker><marker id="ahb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah bad" d="M0 0L8 4L0 8z"/></marker></defs>`;
  conf.forEach(c => {
    const ri = G.rowIdx[c.from], rj = G.rowIdx[c.to];
    if (ri === undefined || rj === undefined) return;
    const a = findItem(p, c.from).it, b = findItem(p, c.to).it;
    if (a.id === b.id) return;
    const x1 = a.kind === 'milestone' ? (toDn(a.date) - p0 + .5) * dw + 9 : (toDn(a.end) - p0 + 1) * dw;
    const x2 = b.kind === 'milestone' ? (toDn(b.date) - p0 + .5) * dw - 10 : (toDn(b.start) - p0) * dw - 1;
    const y1 = ri * rowH + 15, y2 = rj * rowH + 15;
    let d;
    if (x2 - 8 >= x1 + 6) { const xm = x1 + 6; d = `M${x1} ${y1}H${xm}V${y2}H${x2}`; }
    else { const ym = y2 > y1 ? rj * rowH : (rj + 1) * rowH; d = `M${x1} ${y1}H${x1 + 8}V${ym}H${x2 - 10}V${y2}H${x2}`; }
    out += `<path class="arr${c.bad ? ' bad' : ''}" d="${d}" marker-end="url(#${c.bad ? 'ahb' : 'ah'})"/>`;
  });
  svg.innerHTML = out;
}

/* drag */
let drag = null;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.bar[data-id], .mile[data-id]');
  if (!el || UI.view !== 'project' || e.button > 0) return;
  const p = Store.get(UI.pid); const f = findItem(p, el.dataset.id); if (!f) return;
  const it = f.it;
  const sg = el.dataset.seg && it.segs ? it.segs.find(x => x.id === el.dataset.seg) : null;
  if (it.kind === 'task' && !sg) return;
  const mode = e.target.classList.contains('h-l') ? 'l' : e.target.classList.contains('h-r') ? 'r' : 'm';
  drag = { p, it, sg, el, mode, x0: e.clientX, s0: toDn(sg ? sg.start : itStart(it)), e0: toDn(sg ? sg.end : itEnd(it)), moved: false, pointerId: e.pointerId };
  try { el.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const dx = e.clientX - drag.x0;
  if (Math.abs(dx) > 3) drag.moved = true;
  if (!drag.moved) return;
  if (drag.it.locked) { if (!drag.warned) { drag.warned = true; toast('這個任務已鎖定日期,要調整請先點名稱旁的鎖頭解除'); } return; }
  const d = Math.round(dx / G.dw);
  const { p, it, mode, s0, e0, el } = drag;
  const ps = toDn(p.start), pe = G.p0 + G.days - 1 + 30;
  if (it.kind === 'milestone') {
    it.date = fromDn(clamp(s0 + d, ps, pe));
    const x = (toDn(it.date) - G.p0 + .5) * G.dw;
    el.style.left = x + 'px';
    const ml = document.querySelector(`[data-ml="${it.id}"]`); if (ml) { ml.style.left = (x + 13) + 'px'; ml.textContent = md(it.date); }
  } else {
    let ns = s0, ne = e0;
    if (mode === 'm') { const len = e0 - s0; ns = clamp(s0 + d, ps, pe - len); ne = ns + len; }
    else if (mode === 'l') ns = clamp(s0 + d, ps, e0);
    else ne = clamp(e0 + d, s0, pe);
    const sg = drag.sg;
    sg.start = fromDn(ns); sg.end = fromDn(ne); syncTask(it);
    const w = (ne - ns + 1) * G.dw;
    el.style.left = (ns - G.p0) * G.dw + 'px'; el.style.width = w + 'px';
    const bt = el.querySelector('.bt'); if (bt && !sg.name) bt.textContent = barText(sg, w);
  }
  drawArrows(drag.p);
});
const endDrag = e => {
  if (!drag || (e && e.pointerId !== drag.pointerId)) return;
  const d = drag; drag = null;
  if (d.moved) {
    const cs = d.sg ? d.sg.start : itStart(d.it), ce = d.sg ? d.sg.end : itEnd(d.it);
    const changed = toDn(cs) !== d.s0 || toDn(ce) !== d.e0;
    if (changed) { const mv = cascade(d.p, [d.it.id]); Store.save(d.p); renderProject(d.p); restoreScroll(); cascadeToast(d.p, mv); }
  } else openItemModal(d.p, d.it.id);
};
let ganttScroll = 0;
function restoreScroll() { const b = $('#gantt'); if (b) b.scrollLeft = ganttScroll; }
document.addEventListener('pointerup', e => { const b = $('#gantt'); if (b) ganttScroll = b.scrollLeft; endDrag(e); });
document.addEventListener('pointercancel', e => { if (drag) { const d = drag; drag = null; if (d.mode === 'm' || true) { if (d.it.kind === 'milestone') d.it.date = fromDn(d.s0); else if (d.sg) { d.sg.start = fromDn(d.s0); d.sg.end = fromDn(d.e0); syncTask(d.it); } renderGantt(d.p); } } });

/* ---------- modals ---------- */
function openModal(html, mount) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov = root.firstElementChild;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(); });
  if (mount) mount(ov);
  const first = ov.querySelector('input[type=text],input,select,textarea,button'); if (first) setTimeout(() => first.focus(), 30);
}
function closeModal() { const r = $('#modal-root'); if (r) r.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
const mHead = title => `<div class="modal-h"><h3>${title}</h3><button class="icon-btn" data-act="close-modal" aria-label="關閉">${ICON.close}</button></div>`;

      <div class="field"><label for="pf-name">專案名稱</label><input type="text" id="pf-name" value="${esc(v.name)}" placeholder="例如:AOI 設備串接" required></div>
      <div class="field"><label for="pf-owner">負責人</label><input type="text" id="pf-owner" value="${esc(v.owner)}"></div>

        <div class="field"><label for="pf-start">開始日</label><input type="date" id="pf-start" value="${v.start}"></div>

      <div class="r"><button class="btn" data-act="close-modal">取消</button><button class="btn primary" type="submit" form="pform">${isNew ? '建立專案' : '儲存'}</button></div></div>`,
  ov => {

function openPhaseModal(p, ph) {
  const isNew = !ph;
  openModal(`${mHead(isNew ? '新增階段' : '編輯階段')}
    <form id="phform" class="modal-b" novalidate>
      <div class="field"><label for="ph-name">階段名稱</label><input type="text" id="ph-name" value="${esc(ph ? ph.name : '')}" placeholder="例如:設備架設"></div>
      ${isNew ? '' : `<div class="field"><span class="lb">排列順序</span><div style="display:flex;gap:8px"><button type="button" class="btn sm" id="ph-up">往上移</button><button type="button" class="btn sm" id="ph-down">往下移</button></div></div>`}
      <div class="err" id="ph-err"></div><div id="ph-confirm"></div>
    </form>
    <div class="modal-f">${isNew ? '' : `<button class="btn danger" type="button" id="ph-del">刪除階段</button>`}
      <div class="r"><button class="btn" data-act="close-modal">取消</button><button class="btn primary" type="submit" form="phform">${isNew ? '新增' : '儲存'}</button></div></div>`,
  () => {
    $('#phform').addEventListener('submit', e => {
      e.preventDefault();

    });
    const mv = dir => { const i = p.phases.indexOf(ph), j = i + dir; if (j < 0 || j >= p.phases.length) return; p.phases.splice(i, 1); p.phases.splice(j, 0, ph); Store.save(p); renderProject(p); openPhaseModal(p, ph); };

        $('#ph-del2').addEventListener('click', () => {
          const gone = new Set(ph.items.map(i => i.id));
          p.phases = p.phases.filter(x => x !== ph);
          allItems(p).forEach(({ it }) => { it.deps = it.deps.filter(d => !gone.has(d)); });
          Store.save(p); closeModal(); renderProject(p);
        });
      });
    }
  });
}

function openItemModal(p, itemId, newPhaseId) {
  const f = itemId ? findItem(p, itemId) : null;
  const isNew = !f;
  const t = todayStr();
  const defStart = (t >= p.start && t <= p.end) ? t : p.start;
  const it = f ? f.it : { kind: 'task', name: '', start: defStart, end: fromDn(Math.min(toDn(defStart) + 2, toDn(p.end))), date: defStart, deps: [], done: false };
  const curPhase = f ? f.ph.id : newPhaseId;
  let segs = (it.segs && it.segs.length ? it.segs : [{ id: newId(), name: '', start: it.start || defStart, end: it.end || defStart }]).map(x => ({ ...x }));
  let kind = it.kind;
  const depList = p.phases.map(ph => {
    const opts = ph.items.filter(x => x.id !== it.id).map(x => `<label><input type="checkbox" name="dep" value="${x.id}" ${it.deps.includes(x.id) ? 'checked' : ''}>${x.kind === 'milestone' ? '◆ ' : ''}${esc(x.name)}<span class="d">${x.kind === 'milestone' ? md(x.date) : md(x.start) + '–' + md(x.end)}</span></label>`).join('');
    return opts ? `<div class="grp">${esc(ph.name)}</div>${opts}` : '';
  }).join('');
  openModal(`${mHead(isNew ? '新增項目' : '編輯項目')}
    <form id="iform" class="modal-b" novalidate>
      <div class="seg" role="group" aria-label="類型"><button type="button" data-kind="task">任務</button><button type="button" data-kind="milestone">里程碑</button></div>
      <div class="field"><label for="if-name">名稱</label><input type="text" id="if-name" value="${esc(it.name)}" placeholder="例如:設備進場"></div>
      <div class="field"><label for="if-phase">所屬階段</label><select id="if-phase">${p.phases.map(ph => `<option value="${ph.id}"${ph.id === curPhase ? ' selected' : ''}>${esc(ph.name)}</option>`).join('')}</select></div>
      <div class="field" id="if-range"><span class="lb">進度條 · 可分成多段,每段填子任務名稱就會顯示在長條上</span>
        <div class="seg-head"><span>子任務名稱</span><span>開始日</span><span>結束日</span><span></span></div>
        <div class="segs" id="if-segs"></div>
        <div><button type="button" class="btn sm" id="if-addseg">${ICON.plus}新增進度條</button></div>
      </div>
      <div class="field" id="if-datef"><label for="if-date">日期</label><input type="date" id="if-date" min="${p.start}" value="${it.date || it.end || defStart}"></div>
      ${isNew ? '' : `<div class="field"><span class="lb">預計日期${it.kind === 'milestone' ? ` · ${md(it.bd)}${delayDays(it) > 0 ? `(延 ${delayDays(it)} 天)` : ''}` : ''}</span><label class="check-line"><input type="checkbox" id="if-rebase">這次的日期修改是重新規劃,同時更新預計日期(不算延誤)</label></div>`}
      <label class="check-line"><input type="checkbox" id="if-done" ${it.done ? 'checked' : ''}>已完成</label>
      <label class="check-line"><input type="checkbox" id="if-lock" ${it.locked ? 'checked' : ''}>鎖定日期(前置任務延後或提前時,這個任務不會自動移動)</label>
      <div class="field"><span class="lb">前置任務(這些完成後才開始)</span>${depList ? `<div class="deps">${depList}</div>` : '<span class="hint">專案裡還沒有其他項目。</span>'}</div>
      <div class="err" id="if-err"></div><div id="if-confirm"></div>
    </form>
    <div class="modal-f">${isNew ? '' : `<button class="btn danger" type="button" id="if-del">刪除</button>`}
      <div class="r"><button class="btn" data-act="close-modal">取消</button><button class="btn primary" type="submit" form="iform">${isNew ? '新增' : '儲存'}</button></div></div>`,
  () => {
    const readSegs = () => { document.querySelectorAll('#if-segs .seg-row').forEach((r, i) => { segs[i].name = r.querySelector('.sn').value.trim(); segs[i].start = r.querySelector('.ss').value; segs[i].end = r.querySelector('.se').value; }); };
    const drawSegs = () => {
      $('#if-segs').innerHTML = segs.map((sg, i) => `<div class="seg-row">
        <input type="text" class="sn" id="seg-n-${sg.id}" value="${esc(sg.name)}" placeholder="${segs.length > 1 ? '例如:第 ' + (i + 1) + ' 批' : '可留空'}" aria-label="子任務名稱">
        <input type="date" class="ss" id="seg-s-${sg.id}" min="${p.start}" value="${sg.start}" aria-label="開始日">
        <input type="date" class="se" id="seg-e-${sg.id}" min="${p.start}" value="${sg.end}" aria-label="結束日">
        <button type="button" class="icon-btn" data-segdel="${i}" aria-label="刪除這段進度條" ${segs.length < 2 ? 'disabled style="opacity:.3;cursor:default"' : ''}>${ICON.x}</button>
        ${sg.bs ? `<div class="seg-base">預計 ${md(sg.bs)} – ${md(sg.be)}${sg.end > sg.be ? ` · <b>延 ${daysBetween(sg.be, sg.end)} 天</b>` : ''}</div>` : ''}</div>`).join('');
    };
    drawSegs();
    $('#if-addseg').addEventListener('click', () => {
      readSegs();
      const last = segs.reduce((m, x) => isDate(x.end) && x.end > m ? x.end : m, p.start);
      const ns = addDays(last, 1);
      segs.push({ id: newId(), name: '', start: ns, end: addDays(ns, 2) });
      drawSegs(); const n = document.getElementById('seg-n-' + segs[segs.length - 1].id); if (n) n.focus();
    });
    $('#if-segs').addEventListener('click', e => {
      const b = e.target.closest('[data-segdel]'); if (!b || segs.length < 2) return;
      readSegs(); segs.splice(+b.dataset.segdel, 1); drawSegs();
    });
    const setKind = k => { kind = k; document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.kind === k)); $('#if-range').hidden = k !== 'task'; $('#if-datef').hidden = k !== 'milestone'; };
    document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setKind(b.dataset.kind)));
    setKind(kind);
    $('#iform').addEventListener('submit', e => {
      e.preventDefault();
      const name = $('#if-name').value.trim(); if (!name) { $('#if-err').textContent = '請填寫名稱'; return; }
      const inR = d => isDate(d) && d >= p.start;
      const rebase = !!($('#if-rebase') && $('#if-rebase').checked);
      const rec = { name, kind, done: $('#if-done').checked, locked: $('#if-lock').checked, deps: [...document.querySelectorAll('input[name=dep]:checked')].map(x => x.value) };
      if (kind === 'task') {
        readSegs();
        for (let i = 0; i < segs.length; i++) {
          const sg = segs[i], lbl = segs.length > 1 ? `第 ${i + 1} 段進度條` : '進度條';
          if (!inR(sg.start) || !inR(sg.end)) { $('#if-err').textContent = `${lbl}的日期不能早於專案開始日 ${md(p.start)}`; return; }
          if (sg.end < sg.start) { $('#if-err').textContent = `${lbl}的結束日不能早於開始日`; return; }
        }
        rec.segs = segs.map(x => ({ id: x.id, name: half(x.name), start: x.start, end: x.end, bs: rebase || !x.bs ? x.start : x.bs, be: rebase || !x.be ? x.end : x.be }));
        const tmp = { kind: 'task', segs: rec.segs }; syncTask(tmp);
        rec.segs = tmp.segs; rec.start = tmp.start; rec.end = tmp.end; rec.date = undefined;
      } else {
        const d = $('#if-date').value; if (!inR(d)) { $('#if-err').textContent = `日期不能早於專案開始日 ${md(p.start)}`; return; }
        rec.date = d; rec.bd = (rebase || it.kind !== 'milestone' || !it.bd) ? d : it.bd; rec.start = undefined; rec.end = undefined; rec.segs = undefined;
      }
      const target = p.phases.find(x => x.id === $('#if-phase').value);
      let savedId;
      if (isNew) { savedId = newId(); target.items.push(Object.assign({ id: savedId }, clean(rec))); }
      else {
        savedId = it.id;
        Object.keys(rec).forEach(k => { if (rec[k] === undefined) delete it[k]; else it[k] = rec[k]; });
        if (it.kind === 'task') delete it.bd;
        if (target !== f.ph) { f.ph.items = f.ph.items.filter(x => x !== it); target.items.push(it); }
      }
      const mv = cascade(p, [savedId]);
      if (rebase) mv.forEach((_, id) => setBaseline(findItem(p, id).it));
      Store.save(p); closeModal(); renderProject(p); cascadeToast(p, mv);
    });
    const del = $('#if-del');
    if (del) del.addEventListener('click', () => {
      $('#if-confirm').innerHTML = `<div class="confirm-box"><span>確定刪除「${esc(it.name)}」?</span><button class="btn sm danger" type="button" id="if-del2">刪除</button></div>`;
      $('#if-del2').addEventListener('click', () => {
        f.ph.items = f.ph.items.filter(x => x !== it);
        allItems(p).forEach(({ it: o }) => { o.deps = o.deps.filter(d => d !== it.id); });
        Store.save(p); closeModal(); renderProject(p);
      });
    });
  });
}
function openBaselineModal(p) {
  const n = allItems(p).length;
  openModal(`${mHead('設為預計日期')}<div class="modal-b"><p style="margin:0;line-height:1.7">把目前 <b class="num">${n}</b> 個任務和里程碑的日期記為「預計日期」。之後任務被拉長或延後,甘特圖會用灰線標出原本的預計日期,並顯示延誤天數。</p><p class="hint" style="margin:0">適合在排好計畫、正式開工前按一次。已經顯示的延誤紀錄會清除。</p></div>
    <div class="modal-f"><div class="r"><button class="btn" data-act="close-modal">取消</button><button class="btn primary" id="bl-go">設為預計日期</button></div></div>`, () => {
    $('#bl-go').addEventListener('click', () => { allItems(p).forEach(({ it }) => setBaseline(it)); Store.save(p); closeModal(); renderProject(p); toast('已將目前日期設為預計日期'); });
  });
}
const clean = o => { const r = {}; Object.keys(o).forEach(k => { if (o[k] !== undefined) r[k] = o[k]; }); return r; };

/* ---------- export / import ---------- */
async function doExport() {
  const data = JSON.stringify({ app: 'project-gantt', version: 1, exportedAt: new Date().toISOString(), projects: Store.list() }, null, 2);
  const filename = `專案備份-${todayStr()}.json`;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (_) {}
  if (dl) {
    try { await dl.save({ filename, data }); toast('已匯出備份'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    if (!window.claude) { toast('已匯出備份'); return; }
  } catch (_) {}
  openModal(`${mHead('匯出備份')}<div class="modal-b"><p class="hint" style="margin:0">這個檢視無法直接下載檔案。請複製下方內容,另存成 .json 檔。</p><div class="field"><textarea id="ex-txt" readonly>${esc(data)}</textarea></div></div>
    <div class="modal-f"><div class="r"><button class="btn" data-act="close-modal">關閉</button><button class="btn primary" id="ex-copy">複製內容</button></div></div>`, () => {
    $('#ex-copy').addEventListener('click', () => {
      const ta = $('#ex-txt');
      navigator.clipboard.writeText(data).then(() => toast('已複製')).catch(() => { ta.focus(); ta.select(); toast('已選取內容,請按 Ctrl+C 複製'); });
    });
  });
}
$('#import-file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let list;
    try { const obj = JSON.parse(r.result); list = Array.isArray(obj) ? obj : obj.projects; if (!Array.isArray(list)) throw 0; }
    catch (_) { toast('檔案格式不符,請選擇從這裡匯出的備份檔'); return; }
    list = list.filter(p => p && typeof p === 'object');
    const overwrite = list.filter(p => p.id && Store.get(p.id)).length;
    openModal(`${mHead('匯入備份')}<div class="modal-b"><p style="margin:0">檔案裡有 <b class="num">${list.length}</b> 個專案。${overwrite ? `其中 ${overwrite} 個和現有專案相同,匯入後會以檔案內容取代。` : '會加入到目前的專案目錄。'}</p></div>
      <div class="modal-f"><div class="r"><button class="btn" data-act="close-modal">取消</button><button class="btn primary" id="im-go">匯入</button></div></div>`, () => {
      $('#im-go').addEventListener('click', () => {
        list.forEach(p => { const np = normalize(p, p.id || newId()); Store.save(np, true); });
        closeModal(); go(null); toast(`已匯入 ${list.length} 個專案`);
      });
    });
  };
  r.readAsText(file);
});

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  const p = UI.pid ? Store.get(UI.pid) : null;
  switch (act) {
    case 'open': go(a.dataset.id); break;
    case 'home': go(null); break;
    case 'new-project': openProjectModal(null); break;
    case 'edit-project': openProjectModal(p); break;
    case 'export': doExport(); break;
    case 'import': $('#import-file').click(); break;
    case 'close-modal': e.preventDefault(); closeModal(); break;
    case 'week': {
      const d = +a.dataset.d;
      if (UI.view === 'project') UI.weekOffset = d === 0 ? 0 : UI.weekOffset + d;
      else UI.homeWeekOffset = d === 0 ? 0 : UI.homeWeekOffset + d;
      rerenderTodos(); break;
    }
    case 'todo-edit': { const q = Store.get(a.dataset.pid); if (q) openTodoModal(q, a.dataset.d, a.dataset.id); break; }
    case 'todo-del': { const q = Store.get(a.dataset.pid); if (!q) break; const d = a.dataset.d; q.todos[d] = (q.todos[d] || []).filter(x => x.id !== a.dataset.id); if (!q.todos[d].length) delete q.todos[d]; Store.save(q); rerenderTodos(); break; }
    case 'add-phase': openPhaseModal(p, null); break;
    case 'set-baseline': openBaselineModal(p); break;
    case 'side-toggle': {
      const closed = !sideClosed(); setSideClosed(closed);
      $('#p-layout').classList.toggle('side-closed', closed); renderSide(p);
      const b = $('#gantt'); const sl = b ? b.scrollLeft : 0; renderGantt(p); if ($('#gantt')) $('#gantt').scrollLeft = sl;
      break;
    }
    case 'check-del': p.checklist = p.checklist.filter(x => x.id !== a.dataset.id); Store.save(p); renderSide(p); break;
    case 'edit-phase': openPhaseModal(p, p.phases.find(x => x.id === a.dataset.id)); break;
    case 'toggle-lock': {
      const f = findItem(p, a.dataset.id); if (!f) break;
      f.it.locked = !f.it.locked;
      const b = $('#gantt'); const sl = b ? b.scrollLeft : 0;
      let mv = null;
      if (!f.it.locked) { mv = cascade(p, f.it.deps); }  // unlocking lets it follow its predecessors again
      Store.save(p);
      if (mv && [...mv.values()].some(n => n)) { renderProject(p); cascadeToast(p, mv); }
      else { renderGantt(p); toast(f.it.locked ? `已鎖定「${f.it.name}」的日期` : `已解除鎖定「${f.it.name}」`); }
      if ($('#gantt')) $('#gantt').scrollLeft = sl;
      break;
    }
    case 'toggle-phase': { const ph = p.phases.find(x => x.id === a.dataset.id); ph.collapsed = !ph.collapsed; Store.save(p); renderGantt(p); break; }
    case 'add-item': openItemModal(p, null, a.dataset.id); break;
    case 'edit-item': openItemModal(p, a.dataset.id); break;
  }
});
document.addEventListener('change', e => {
  const a = e.target;
  if (a.id === 'f-who' || a.id === 'f-pid' || a.id === 'f-st') { UI.f[a.id.slice(2)] = a.value; savePrefs(); renderTodos(null); return; }
  if (a.id === 'add-pid') { UI.addPid = a.value; savePrefs(); renderTodos(null); return; }
  if (a.id === 'add-who' && UI.pid) { UI.addWho[UI.pid] = a.value.trim(); return; }
  if (a.dataset.act === 'todo-toggle') {
    const q = Store.get(a.dataset.pid); const x = q && (q.todos[a.dataset.d] || []).find(y => y.id === a.dataset.id);
    if (x) { x.done = a.checked; Store.save(q); if (UI.view === 'home' && UI.f.st !== 'all') setTimeout(() => renderTodos(null), 350); else a.closest('.todo').classList.toggle('done', x.done); }
    return;
  }
  const p = UI.pid ? Store.get(UI.pid) : null; if (!p) return;
  if (a.id === 'status-sel') { p.status = a.value; a.className = 'status-select st-' + p.status; Store.save(p); return; }
  if (a.dataset.act === 'check-toggle') { const x = p.checklist.find(y => y.id === a.dataset.id); if (x) { x.done = a.checked; Store.save(p); renderSide(p); } return; }
  if (a.dataset.act === 'toggle-done') { const f = findItem(p, a.dataset.id); if (f) { f.it.done = a.checked; Store.save(p); const b = $('#gantt'); const sl = b ? b.scrollLeft : 0; renderGantt(p); if ($('#gantt')) $('#gantt').scrollLeft = sl; } }
});
let notesT;
document.addEventListener('input', e => {
  if (e.target.id !== 'notes-ta') return;
  const p = Store.get(UI.pid); if (!p) return;
  p.notes = e.target.value;
  clearTimeout(notesT); notesT = setTimeout(() => Store.save(p), 400);
});
document.addEventListener('keydown', e => {
  const a = e.target;
  if (a.dataset && a.dataset.checkAdd && e.key === 'Enter' && !e.isComposing) {
    const text = a.value.trim(); if (!text) return;
    const p = Store.get(UI.pid); p.checklist.push({ id: newId(), text, done: false });
    Store.save(p); renderSide(p); const ni = $('#check-in'); if (ni) ni.focus();
    return;
  }
  if (!a.dataset || !a.dataset.todoAdd || e.key !== 'Enter' || e.isComposing) return;
  const text = a.value.trim(); if (!text) return;
  const p = Store.get(a.dataset.pid || UI.pid); if (!p) return; const d = a.dataset.todoAdd;
  let who = '';
  if (UI.view === 'project') { const w = $('#add-who'); who = w ? w.value.trim() : ''; UI.addWho[p.id] = who; }
  else who = UI.f.who;
  (p.todos[d] = p.todos[d] || []).push({ id: newId(), text, done: false, who: who === p.owner ? '' : who });
  Store.save(p); rerenderTodos();
  const ni = document.getElementById('todo-in-' + d); if (ni) ni.focus();
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (UI.view === 'project') { const p = Store.get(UI.pid); if (p) { setHeadH(); renderGantt(p); } } }, 150); });
window.addEventListener('hashchange', () => { G.scrolled = false; route(); });

/* ---------- boot ---------- */
(async () => {
  await Store.init();
  Store.list().forEach(p => { if (rollover(p)) Store.save(p); });
  route();
})();
})();
</script>
